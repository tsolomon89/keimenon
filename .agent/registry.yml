version: 1.0.0
system: Keimenon Agent OS

workflows:
  - name: sqlite-schema-migration
    purpose: 'Orchestrates safe execution and validation of SQLite schema migrations'
    owning_persona: sqlite-storage-specialist
    supporting_personas: [architecture-contract-guardian]
    skills_used: [mcp-integration-expert, graph-schema-validator]
    activation_triggers: 'Manual invocation or migration needed'
    inputs_expected: 'Migration script'
    outputs_required: 'Validated schema'
    files_directories_inspected: 'packages/db'
    commands_usually_run: 'npm run sqlite:check, npm run migrate:to-local:dry-run'
    evidence_required: 'SQLite schema dump'
    risk_level: 'High'
    permissions:
      may_edit_code: true
      may_edit_docs: false
      may_run_commands: true
      may_delete_files: false
    required_gates: 'Test suite'
  - name: golden-path-verification
    purpose: 'Coordinates E2E tests, builds, and runtime doctors for full-stack release gates'
    owning_persona: pipeline-verifier
    supporting_personas: [e2e-test-generator]
    skills_used: [autonomous-test-runner]
    activation_triggers: 'Pre-release or major PR'
    inputs_expected: 'None'
    outputs_required: 'Test report'
    files_directories_inspected: 'tests/e2e'
    commands_usually_run: 'npm run doctor:runtime, npm run lint, npm run type-check, npm run test, npm run build, npm run test:auth, npm run migrate:to-local:dry-run, npm run sqlite:check, npm run e2e:smoke'
    evidence_required: 'Test results'
    risk_level: 'Low'
    permissions:
      may_edit_code: false
      may_edit_docs: false
      may_run_commands: true
      may_delete_files: false
    required_gates: 'None'
  - name: chat-import-pipeline
    purpose: 'Validates chunked ingestions, entity resolution, and similarity edge generation'
    owning_persona: chat-import-pipeline-engineer
    supporting_personas: [entity-resolution-specialist, semantic-grouping-architect]
    skills_used: [vector-similarity-ops, mcp-integration-expert]
    activation_triggers: 'Import changes'
    inputs_expected: 'Test data'
    outputs_required: 'Graph validation'
    files_directories_inspected: 'apps/api/src/modules/import-pipeline'
    commands_usually_run: 'npm run test:data:split'
    evidence_required: 'Database snapshot'
    risk_level: 'Medium'
    permissions:
      may_edit_code: true
      may_edit_docs: false
      may_run_commands: true
      may_delete_files: false
    required_gates: 'Tests'
  - name: graph-canvas-development
    purpose: 'Coordinates React state synchronization with the Three.js renderer schema'
    owning_persona: graph-rendering-engineer
    supporting_personas: [web-app-engineer]
    skills_used: [e2e-test-generator]
    activation_triggers: 'UI changes'
    inputs_expected: 'Feature request'
    outputs_required: 'React components'
    files_directories_inspected: 'apps/web/src'
    commands_usually_run: 'npm run lint, npm run type-check'
    evidence_required: 'Visual regression'
    risk_level: 'Medium'
    permissions:
      may_edit_code: true
      may_edit_docs: false
      may_run_commands: true
      may_delete_files: false
    required_gates: 'Lint'
  - name: n-pass-iteration
    purpose: 'Iteratively refines agent context and specs to reduce ambiguity without destabilizing the corpus'
    owning_persona: documentation-steward
    supporting_personas: [meta-text-assembler]
    skills_used: [research-specialist]
    activation_triggers: 'Ambiguous spec'
    inputs_expected: 'Draft spec'
    outputs_required: 'Refined spec'
    files_directories_inspected: 'docs/'
    commands_usually_run: 'manual/none'
    evidence_required: 'Diff'
    risk_level: 'Low'
    permissions:
      may_edit_code: false
      may_edit_docs: true
      may_run_commands: false
      may_delete_files: false
    required_gates: 'Review'
  - name: project-orientation
    purpose: 'Gets a fresh coding agent up to speed on the project architecture.'
    owning_persona: repo-cartographer
    supporting_personas: [documentation-steward]
    skills_used: [research-specialist]
    activation_triggers: 'New agent startup'
    inputs_expected: 'None'
    outputs_required: 'Project map, runtime contract, quality gates'
    files_directories_inspected: 'README.md, apps/, packages/, docs/'
    commands_usually_run: 'npm run doctor:runtime'
    evidence_required: 'Summary report'
    risk_level: 'Low'
    permissions:
      may_edit_code: false
      may_edit_docs: false
      may_run_commands: true
      may_delete_files: false
    required_gates: 'None'
  - name: test-stabilization
    purpose: 'Fix broken/flaky tests and improve test structure while preserving assertion strength.'
    owning_persona: test-strategy-engineer
    supporting_personas: [pipeline-verifier]
    skills_used: [autonomous-test-healer, autonomous-test-runner]
    activation_triggers: 'Flaky test reports'
    inputs_expected: 'Test logs'
    outputs_required: 'Stabilized tests'
    files_directories_inspected: 'tests/'
    commands_usually_run: 'npm run e2e:smoke'
    evidence_required: 'Consistent test passes'
    risk_level: 'Medium'
    permissions:
      may_edit_code: true
      may_edit_docs: false
      may_run_commands: true
      may_delete_files: false
    required_gates: 'Coverage preserved'
  - name: api-backend-contract
    purpose: 'API/database/service-layer work while checking auth and account_id scope.'
    owning_persona: api-contract-engineer
    supporting_personas: [security-auth-reviewer, account-isolation-guardian]
    skills_used: [mcp-integration-expert, security-auditor]
    activation_triggers: 'Backend API changes'
    inputs_expected: 'API spec'
    outputs_required: 'Endpoints, tests'
    files_directories_inspected: 'apps/api'
    commands_usually_run: 'npm run test:auth'
    evidence_required: 'API tests passing'
    risk_level: 'High'
    permissions:
      may_edit_code: true
      may_edit_docs: true
      may_run_commands: true
      may_delete_files: false
    required_gates: 'Security review'
  - name: web-ui-development
    purpose: 'Next.js/React changes ensuring data fetching, state, accessibility, and E2E impact.'
    owning_persona: web-app-engineer
    supporting_personas: [graph-rendering-engineer]
    skills_used: [e2e-test-generator]
    activation_triggers: 'Frontend UI changes'
    inputs_expected: 'Design/Spec'
    outputs_required: 'React components'
    files_directories_inspected: 'apps/web'
    commands_usually_run: 'npm run build'
    evidence_required: 'Visual check, E2E tests'
    risk_level: 'Medium'
    permissions:
      may_edit_code: true
      may_edit_docs: false
      may_run_commands: true
      may_delete_files: false
    required_gates: 'Lint, Typecheck'
  - name: desktop-runtime
    purpose: 'Electron/local runtime work checking ABI, packaged dist sync, and local paths.'
    owning_persona: desktop-runtime-engineer
    supporting_personas: [architecture-contract-guardian]
    skills_used: [mcp-integration-expert]
    activation_triggers: 'Desktop app changes'
    inputs_expected: 'Spec'
    outputs_required: 'Electron main/preload changes'
    files_directories_inspected: 'apps/desktop'
    commands_usually_run: 'npm run desktop:web-dist:verify, npm run desktop:rebuild-native'
    evidence_required: 'App launch success'
    risk_level: 'High'
    permissions:
      may_edit_code: true
      may_edit_docs: false
      may_run_commands: true
      may_delete_files: false
    required_gates: 'Build success'
  - name: graph-data-model
    purpose: 'Node/edge/schema changes ensuring provenance, immutability, and dedupe semantics.'
    owning_persona: graph-schema-validator
    supporting_personas: [source-provenance-auditor, semantic-grouping-architect]
    skills_used: [graph-schema-validator, vector-similarity-ops]
    activation_triggers: 'Schema changes'
    inputs_expected: 'Schema spec'
    outputs_required: 'Updated validators'
    files_directories_inspected: 'packages/db, packages/types'
    commands_usually_run: 'npm run sqlite:check'
    evidence_required: 'Validation success'
    risk_level: 'High'
    permissions:
      may_edit_code: true
      may_edit_docs: true
      may_run_commands: true
      may_delete_files: false
    required_gates: 'Schema review'
  - name: security-privacy-review
    purpose: 'Review auth, account isolation, local data, MCP exposure, and data exfiltration risk.'
    owning_persona: security-auth-reviewer
    supporting_personas: [account-isolation-guardian]
    skills_used: [security-auditor]
    activation_triggers: 'Security audit request'
    inputs_expected: 'PR or codebase'
    outputs_required: 'Security report'
    files_directories_inspected: '**/*'
    commands_usually_run: 'npm run ci:hygiene:check'
    evidence_required: 'Audit log'
    risk_level: 'High'
    permissions:
      may_edit_code: false
      may_edit_docs: true
      may_run_commands: true
      may_delete_files: false
    required_gates: 'None'
  - name: documentation-sync
    purpose: 'Aligning docs with code, identifying stale docs, preserving provenance without hallucinating.'
    owning_persona: documentation-steward
    supporting_personas: [repo-cartographer]
    skills_used: [research-specialist]
    activation_triggers: 'Feature completion'
    inputs_expected: 'Code diffs'
    outputs_required: 'Updated docs'
    files_directories_inspected: 'docs/'
    commands_usually_run: 'manual/none'
    evidence_required: 'Doc diffs'
    risk_level: 'Low'
    permissions:
      may_edit_code: false
      may_edit_docs: true
      may_run_commands: false
      may_delete_files: false
    required_gates: 'Review'
  - name: dependency-runtime-maintenance
    purpose: 'Node/npm/dependency/native runtime work enforcing Node 24 and npm strictness.'
    owning_persona: ops-hygiene-engineer
    supporting_personas: [desktop-runtime-engineer]
    skills_used: [code-execution-orchestrator]
    activation_triggers: 'Dependency updates'
    inputs_expected: 'npm outdated'
    outputs_required: 'package.json updates'
    files_directories_inspected: 'package.json, package-lock.json'
    commands_usually_run: 'npm install, npm run doctor:runtime'
    evidence_required: 'Build success'
    risk_level: 'Medium'
    permissions:
      may_edit_code: true
      may_edit_docs: false
      may_run_commands: true
      may_delete_files: true
    required_gates: 'All tests pass'
  - name: master-dev-team-orchestrator
    purpose: 'Coordinates all other workflows and routes to specialized workflows based on task classification.'
    owning_persona: repo-cartographer
    supporting_personas: []
    skills_used: [code-execution-orchestrator]
    activation_triggers: 'New user task'
    inputs_expected: 'User request'
    outputs_required: 'Delegated workflow'
    files_directories_inspected: '.agent/workflows'
    commands_usually_run: 'manual/none'
    evidence_required: 'Routing logs'
    risk_level: 'Low'
    permissions:
      may_edit_code: false
      may_edit_docs: false
      may_run_commands: false
      may_delete_files: false
    required_gates: 'None'
  - name: full-stack-feature-builder
    purpose: 'Implements a feature across the full stack with tests and architectural review.'
    owning_persona: web-app-engineer
    supporting_personas: [api-contract-engineer, architecture-contract-guardian]
    skills_used: [code-review-enforcer, e2e-test-generator]
    activation_triggers: 'Feature implementation request'
    inputs_expected: 'Feature spec'
    outputs_required: 'Code, tests, evidence summary'
    files_directories_inspected: 'apps/, packages/'
    commands_usually_run: 'npm run type-check, npm run test'
    evidence_required: 'Verification report'
    risk_level: 'High'
    permissions:
      may_edit_code: true
      may_edit_docs: true
      may_run_commands: true
      may_delete_files: false
    required_gates: 'architecture/security review'
  - name: dead-code-cleanup
    purpose: 'Safe, reversible code deletion with required multi-evidence checking and post-deletion test runs.'
    owning_persona: ops-hygiene-engineer
    supporting_personas: [repo-cartographer]
    skills_used: [code-review-enforcer]
    activation_triggers: 'Cleanup request'
    inputs_expected: 'Target paths'
    outputs_required: 'File-by-file deletion rationale'
    files_directories_inspected: '**/*'
    commands_usually_run: 'npm run type-check, npm run test'
    evidence_required: 'Reversible evidence, tests passed'
    risk_level: 'High'
    permissions:
      may_edit_code: true
      may_edit_docs: true
      may_run_commands: true
      may_delete_files: true
    required_gates: 'Requires 2 forms of evidence'

