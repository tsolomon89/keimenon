name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Node 24 Native ABI
        run: npm rebuild better-sqlite3

      - name: Run Runtime Doctor
        run: npm run doctor:runtime

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

      - name: Enforce Runtime Mock Ban
        run: npm run ci:mock-ban:check

      - name: Enforce Repo Hygiene
        run: npm run ci:hygiene:check

      - name: Bootstrap Database
        run: npm run factory-reset:db-only

      - name: Run SQLite Integrity Check
        run: npm run sqlite:check

      - name: Run Test
        run: npm run test

      - name: Run Build
        run: npm run build

      - name: Run Auth Test Suite
        run: npm run test:auth

      - name: Run Local Migration Dry Run
        run: npm run migrate:to-local:dry-run

  windows-runtime-verification:
    runs-on: windows-latest
    env:
      RELEASE_BUILD: '1'
      KEIMENON_REQUIRE_NATIVE_BUILD: '1'
      CI_NATIVE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies (with mandatory native addon build)
        run: npm ci

      - name: Ensure Node 24 Native ABI
        run: npm rebuild better-sqlite3

      - name: Run Runtime Doctor
        run: npm run doctor:runtime

      - name: Run Native Runtime Integration Gate
        run: npm run rc:check:native

      - name: Run Auth Launcher Smoke
        run: npm run test:auth
