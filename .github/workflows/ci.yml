name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Runtime Doctor
        run: npm run doctor:runtime

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

      - name: Enforce Runtime Mock Ban
        run: npm run ci:mock-ban:check

      - name: Enforce Repo Hygiene
        run: npm run ci:hygiene:check

      - name: Run Test
        run: npm run test

      - name: Run Build
        run: npm run build

      - name: Run Auth Test Suite
        run: npm run test:auth

      - name: Run Local Migration Dry Run
        run: npm run migrate:to-local:dry-run

  windows-runtime-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Runtime Doctor
        run: npm run doctor:runtime

      - name: Run Auth Launcher Smoke
        run: npm run test:auth
