name: E2E Smoke Tests

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e-smoke:
    name: E2E Smoke Tests (Quick)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Setup test environment
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env.local
          echo "NODE_ENV=test" >> apps/api/.env
          echo "STORAGE_MODE=local" >> apps/api/.env

      - name: Build applications
        run: npm run build

      - name: Start servers
        run: |
          cd apps/api && npm run start &
          cd apps/web && npm run start &

          echo "Waiting for servers..."
          timeout 60 bash -c 'until curl -f http://localhost:4001/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run smoke tests only
        run: npm run e2e -- --grep="@smoke" --project=chromium
        env:
          BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:4001

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: playwright-report/
          retention-days: 3
