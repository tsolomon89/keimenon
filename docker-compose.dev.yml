version: '3.8'

services:
  # Neo4j Database
  neo4j:
    image: neo4j:5.19
    container_name: keimenon-neo4j
    ports:
      - '7474:7474' # HTTP (Browser UI)
      - '7687:7687' # Bolt (API)
    environment:
      - NEO4J_AUTH=neo4j/testpassword
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ['CMD', 'cypher-shell', '-u', 'neo4j', '-p', 'testpassword', 'RETURN 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - keimenon-network

  # API Server (Optional - can run locally for hot reload)
  # Uncomment if you want to run API in Docker
  # api:
  #   build:
  #     context: .
  #     dockerfile: apps/api/Dockerfile.dev
  #   container_name: keimenon-api
  #   ports:
  #     - "3001:3001"
  #   depends_on:
  #     neo4j:
  #       condition: service_healthy
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=3001
  #     - NEO4J_URI=bolt://neo4j:7687
  #     - NEO4J_USER=neo4j
  #     - NEO4J_PASSWORD=testpassword
  #     - STORAGE_PATH=/app/storage
  #     - MAX_FILE_SIZE_MB=2048
  #   volumes:
  #     - ./apps/api:/app/apps/api
  #     - ./packages:/app/packages
  #     - ./storage:/app/storage
  #     - /app/node_modules
  #     - /app/apps/api/node_modules
  #   networks:
  #     - keimenon-network
  #   command: npm run dev

  # Frontend (Optional - can run locally for hot reload)
  # Uncomment if you want to run Frontend in Docker
  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile.dev
  #   container_name: keimenon-web
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api
  #   environment:
  #     - NODE_ENV=development
  #     - NEXT_PUBLIC_API_URL=http://localhost:3001
  #   volumes:
  #     - ./apps/web:/app/apps/web
  #     - ./packages:/app/packages
  #     - /app/node_modules
  #     - /app/apps/web/node_modules
  #     - /app/apps/web/.next
  #   networks:
  #     - keimenon-network
  #   command: npm run dev

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  keimenon-network:
    driver: bridge
