# Docker Compose - Production Configuration
# Keimenon - Multi-tenant Knowledge Management System

version: '3.8'

services:
  # API Server (Backend)
  # Supported topology: one API replica, local bind-mounted disk, no shared network filesystem.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: keimenon-api
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      # Server
      NODE_ENV: production
      PORT: 4001

      # Storage mode (local only)
      STORAGE_MODE: ${STORAGE_MODE:-local}

      # Local Storage (SQLite + Files)
      SQLITE_PATH: /data/keimenon.db
      LOCAL_DOCS_PATH: /data/documents
      STORAGE_PATH: /data/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}

      # Authentication (REQUIRED in production)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable must be set}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

      # Optional: OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Limits (Free tier defaults)
      FREE_MAX_SOURCES: ${FREE_MAX_SOURCES:-500}
      FREE_MAX_NODES: ${FREE_MAX_NODES:-20000}
      FREE_MAX_GROUPS: ${FREE_MAX_GROUPS:-50}
      FREE_STORAGE_GB: ${FREE_STORAGE_GB:-5}

    volumes:
      # Persistent data storage for the single supported SQLite writer
      - keimenon-data:/data

      # Optional: Mount external backup location
      # - /path/to/backups:/backups

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - keimenon-network

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Frontend (Web UI)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: keimenon-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
      INTERNAL_API_URL: http://api:4001
      NEXT_PUBLIC_STORAGE_MODE: ${STORAGE_MODE:-local}

      # Optional: Feature flags
      NEXT_PUBLIC_ENABLE_PRO_FEATURES: ${ENABLE_PRO_FEATURES:-false}
      NEXT_PUBLIC_ENABLE_BUSINESS_FEATURES: ${ENABLE_BUSINESS_FEATURES:-false}

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - keimenon-network

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Nginx Reverse Proxy (Optional - for SSL termination)
  nginx:
    image: nginx:alpine
    container_name: keimenon-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx

    depends_on:
      - api
      - web

    networks:
      - keimenon-network

    # Only start if ENABLE_NGINX is set
    profiles:
      - nginx

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

# Named volumes for persistent data
volumes:
  keimenon-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}

  nginx-cache:
    driver: local

# Network for service communication
networks:
  keimenon-network:
    driver: bridge
# Usage Examples:
#
# 1. Start in local mode (SQLite only):
#    docker-compose -f docker-compose.prod.yml up -d api web
#
# 2. Start with Nginx reverse proxy:
#    docker-compose -f docker-compose.prod.yml --profile nginx up -d
#
# 3. View logs:
#    docker-compose -f docker-compose.prod.yml logs -f api
#
# 4. Stop all services:
#    docker-compose -f docker-compose.prod.yml down
#
# 5. Backup data:
#    docker cp keimenon-api:/data ./backup-$(date +%Y%m%d)
#
# 6. Restore data:
#    docker cp ./backup-20241012 keimenon-api:/data
