# Keimenon Clustering Policy
# All thresholds and behavioral knobs are admin-configurable
# Changes create new policy signatures for reproducibility

version: '1.0.0'

# Overlap and membership rules
overlap:
  # Exclusive membership per slice (level × modality)
  # If true, node can belong to at most one cluster per slice
  exclusive_per_slice: true

  # Epsilon for multi-candidate detection
  # If two candidates within ε and different structural roots → review queue
  review_epsilon: 0.01

# Temporal treatment in clustering
temporal:
  # Use temporal decay in membership decisions
  # If false, time only affects evidence ranking
  use_in_membership: false

  # Decay half-life in days (if use_in_membership=true)
  # decay_halflife_days: 30

# Gray-band thresholds per modality × level
# attach: score >= attach → auto-attach to cluster
# review_lower: attach > score >= review_lower → review queue
# reject_below: score < reject_below → reject (no edge)

gray_band:
  prose:
    sentence:
      attach: 0.88
      review_lower: 0.75
      reject_below: 0.60
    block:
      attach: 0.88
      review_lower: 0.75
      reject_below: 0.60
    section:
      attach: 0.85
      review_lower: 0.70
      reject_below: 0.55

  code:
    sentence:
      attach: 0.92
      review_lower: 0.80
      reject_below: 0.65
    block:
      attach: 0.92
      review_lower: 0.80
      reject_below: 0.65
    section:
      attach: 0.90
      review_lower: 0.78
      reject_below: 0.63

  math:
    sentence:
      attach: 0.90
      review_lower: 0.78
      reject_below: 0.63
    block:
      attach: 0.90
      review_lower: 0.78
      reject_below: 0.63
    section:
      attach: 0.88
      review_lower: 0.75
      reject_below: 0.60

  json:
    sentence:
      attach: 0.95
      review_lower: 0.85
      reject_below: 0.70
    block:
      attach: 0.95
      review_lower: 0.85
      reject_below: 0.70
    section:
      attach: 0.93
      review_lower: 0.83
      reject_below: 0.68

  markdown:
    sentence:
      attach: 0.88
      review_lower: 0.75
      reject_below: 0.60
    block:
      attach: 0.88
      review_lower: 0.75
      reject_below: 0.60
    section:
      attach: 0.85
      review_lower: 0.70
      reject_below: 0.55

# Evidence weights (monotone combination)
evidence:
  freq_weight: 0.5 # log1p(instances_count)
  diversity_weight: 0.3 # log1p(distinct_blobs)
  role_weight: 0.1 # unique_roles / 3
  temporal_weight: 0.05 # log1p(time_span_days)
  modality_weight: 0.05 # log1p(distinct_modalities)
  coherence_weight: 0.2 # avg(cluster_edge_scores) - for clusters

# Tokenization settings
tokenization:
  prose:
    case_fold: true
    min_token_length: 2
    stop_words_enabled: true

  code:
    language_aware: true
    preserve_operators: true
    alpha_rename: false

  math:
    enabled: true
    preserve_macros: true

  # Ignore fence delimiters (```) and math delimiters ($, $$) in tokenization
  ignore_fences_and_delims: true

# Tie-break rules (deterministic ordering)
tie_breaks:
  # Ordered list of tie-break rules
  # 1. Higher score wins
  # 2. If |Δscore| < epsilon, smaller NodeKey wins
  # 3. Then earlier timestamp
  # 4. Then smaller ContentId
  order:
    - score
    - nodekey
    - timestamp
    - contentid

  # Epsilon for score equality
  score_epsilon: 0.000001

# Publishing settings for edges-only exports
publishing:
  edges_only:
    enabled: true
    keep_last: 10
    hash_algorithm: sha256
    include_reason_codes: true
